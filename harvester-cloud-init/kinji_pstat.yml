#cloud-config
# AlmaLinux 9 Hardening Configuration
# Translated from Packer build process for use in Harvester

package_update: true

# 1. Base Package Installation
packages:
  - qemu-guest-agent
  - lvm2

# 2. User Access
users:
  - name: support
    groups: wheel
    shell: /bin/bash

chpasswd:
  list: |
    root:rubber baby buggy bumpers
    support:rubber baby buggy bumpers

# We use write_files for authorized_keys to overwrite the image's default restrictions
# instead of using the ssh_authorized_keys module which only appends.

# 3. File-based Configurations
write_files:
  - path: /root/.ssh/authorized_keys
    permissions: '0600'
    owner: root:root
    content: |
      ssh-rsa  root@bob.aristotle.ucsb.edu

  # Sudo configuration for the 'wheel' group
  - path: /etc/sudoers.d/wheel-nopasswd
    permissions: '0440'
    content: |
      %wheel ALL=(ALL) NOPASSWD: ALL

  # SSHD Hardening - Commented out for troubleshooting console access
  # - path: /etc/ssh/sshd_config.d/hardening.conf
  #   content: |
  #     PermitRootLogin prohibit-password
  #     PasswordAuthentication no
  #     KbdInteractiveAuthentication no
  #     PubkeyAuthentication yes

# 4. Execution Commands
runcmd:
  # QEMU Guest Agent
  - systemctl enable --now qemu-guest-agent

  # Sequential Package Installation to handle EPEL dependency
  - dnf install -y epel-release
  - dnf makecache
  - dnf install -y firewalld fail2ban ansible-core

  # Ensure SSHD picks up the hardening config and is running
  - systemctl enable sshd
  - systemctl restart sshd

  # Firewall and Fail2Ban basics
  - systemctl enable --now firewalld
  - firewall-cmd --permanent --add-service=ssh
  - firewall-cmd --reload
  - systemctl enable --now fail2ban

  # Ansible Environment setup
  - ansible-galaxy collection install ansible.posix

# Final output to log for verification via 'journalctl -u cloud-init'
final_message: "The system is hardened and ready. Hardening process complete."
