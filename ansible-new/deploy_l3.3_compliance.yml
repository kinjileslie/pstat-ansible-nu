---
# ==============================================================================
# LAYER 3 - CUI COMPLIANCE OVERLAY
# ==============================================================================
# This playbook applies the Red Hat Official RHEL9 CUI hardening role.
# It is an OPTIONAL overlay that should be run AFTER deploy_l3_fortress.yml.
#
# EXECUTION MENU (Tags):
# ------------------------------------------------------------------------------
# Tier 1 (Baseline): --tags "low_complexity,no_reboot_needed"
#   - Low risk, basic security tools and system baseline.
#
# Tier 2 (Standard): --tags "low_complexity,medium_complexity,no_reboot_needed"
#   - Moderate risk, tightens filesystem mounts and SSH timeouts.
#
# Tier 3 (Strict):    --tags "low_complexity,medium_complexity,high_complexity"
#   - High risk, full audit enforcement and restrictive network policies.
# ==============================================================================

- name: Layer 3 - Apply CUI Hardening
  hosts: pstat
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Ensure administrative SSH access is maintained before L3
      include_role:
        name: role_provision_access
    - name: Generate and set a random root password for compliance
      shell: |
        PASS=$(openssl rand -base64 32)
        echo "root:$PASS" | chpasswd
      no_log: true
      changed_when: true

  vars:
    # --- CUI Master Switches (from local testing on gammon/poisson) ---
    # This acts as the master "ON" switch for the OpenSCAP logic
    ansible_compliance_cleanup: true
    
    # These satisfy the 'when' conditions in the role's task files
    enable_strategy: true
    low_complexity: true
    low_disruption: true
    medium_severity: true
    no_reboot_needed: true
    
    # This triggers the "High Level" STIG profile
    rhel9_cui_stig_gui: true

    # --- Custom Overrides ---
    # Set dnf-automatic to only apply security updates, not all updates
    dnf_automatic_upgrade_type: security

    # 1. Alma/VM Incompatibility Neutralization
    package_subscription_manager_installed: false
    package_usbguard_installed: false
    package_fapolicyd_installed: false
    service_usbguard_enabled: false
    service_fapolicyd_enabled: false

    # 2. SELinux Stability (Permissive mode)
    var_selinux_state: "permissive"
    selinux_state: true

    # 3. Storage Fortress Protection (Protect /var/log/audit fstab)
    mount_option_var_log_audit_nodev: false
    mount_option_var_log_audit_noexec: false
    mount_option_var_log_audit_nosuid: false

    # 4. SSH Hardening Centralization (Defer to role_ssh_hardening)
    sshd_disable_host_auth: false
    sshd_disable_empty_passwords: false
    sshd_disable_gssapi_auth: false
    sshd_disable_kerb_auth: false
    sshd_disable_root_login: false
    sshd_enable_warning_banner: false
    sshd_rekey_limit: false

    # Legacy overrides for backward compatibility
    rhel9_cui_subscription_manager_enabled: false
    rhel9_cui_usbguard_enabled: false
    rhel9_cui_fapolicyd_enabled: false

  roles:
    - role: RedHatOfficial.rhel9_cui

  post_tasks:
    - name: "RESTORE ACCESS | Force Ed25519 support in SSHD"
      lineinfile:
        path: /etc/ssh/sshd_config.d/00-pstat-priority.conf
        line: "PubkeyAcceptedAlgorithms +ssh-ed25519"
        create: yes
        mode: '0644'
      register: ssh_override

    - name: "RESTORE ACCESS | Restart SSHD to apply algorithm override"
      systemd:
        name: sshd
        state: restarted
      when: ssh_override.changed

    - name: "IDENTITY | Verify administrative keys are still present"
      include_role:
        name: role_provision_access

    - name: "OPERATIONAL | Ensure basic admin tools aren't restricted"
      debug:
        msg: "Compliance adjustments applied successfully. Operational access restored."
