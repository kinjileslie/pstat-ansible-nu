---
# Firewall Configuration Defaults (V2 - Identity-Based Architecture)

# --- Identity Registry ---
# Define IP sets as: { name: 'set_name', type: 'hash:net' or 'hash:ip', ips: [ 'ip1', 'ip2' ] }
pstat_ipsets:
  - name: management
    type: "hash:ip"
    ips: "{{ pstat_mgmt_ips }}"
  - name: campus
    type: "hash:net"
    ips: ["128.111.0.0/16", "169.231.0.0/16"]
  - name: monitoring
    type: "hash:ip"
    ips: "{{ pstat_monitoring_ips }}"
  - name: backup-network
    type: "hash:ip"
    ips: "{{ pstat_backup_ips }}"

# --- Global Administrative Policies (The VIP Lanes) ---
# Policies are processed BEFORE zones. They ensure admin access regardless of NIC zone.
pstat_firewall_policies:
  - name: mgmt-ssh
    ingress: "ANY"
    egress: "HOST"
    rules:
      - { source: "ipset:management", service: "ssh", action: "accept" }
      - { source: "ipset:management", service: "cockpit", action: "accept" }

# --- Capability Registry ---
# Maps human-readable capabilities to technical rich rules.
# format: { capability_name: { rules: [ { source: 'ipset:name', port: 123, proto: 'tcp', action: 'accept' } ] } }
pstat_capability_map:
  monitoring_target:
    rules:
      - { source: "ipset:monitoring", port: 9100, proto: "tcp", action: "accept" }
      - { source: "ipset:monitoring", service: "snmp", action: "accept" }
  backup_target:
    rules:
      - { source: "ipset:backup-network", port: 9102, proto: "tcp", action: "accept" }
  campus_ssh:
    rules:
      - { source: "ipset:campus", service: "ssh", action: "accept" }

# --- Host Configuration ---
# Default capabilities for all nodes (can be overridden in host_vars)
pstat_capabilities: []

# Mapping for NIC -> Zone (The "Labels")
# Default: Most nodes use eth0 as 'public' for default-deny security.
pstat_nic_zones:
  eth0: "public"
  eth1: "public"

# Baseline zone definitions
pstat_zones:
  public: { source: null }
  internal: { source: "ipset:campus" }
  trusted: { source: "ipset:management" }
