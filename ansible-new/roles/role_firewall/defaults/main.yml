---
# Firewall Configuration Defaults (V2 - Identity-Based Architecture)

# --- Identity Registry ---
# Define IP sets as: { name: 'set_name', type: 'hash:net' or 'hash:ip', ips: [ 'ip1', 'ip2' ] }
pstat_ipsets:
  - name: management
    type: "hash:ip"
    ips: "{{ pstat_mgmt_ips }}"
  - name: campus
    type: "hash:net"
    ips: ["128.111.0.0/16", "169.231.0.0/16"]
  - name: monitoring
    type: "hash:ip"
    ips: "{{ pstat_monitoring_ips }}"
  - name: backup-network
    type: "hash:net"
    ips: ["128.111.90.156/32"]
  - name: tailscale
    type: "hash:net"
    ips: ["100.120.0.0/24"]

# --- Profile Trust Mapping ---
# Maps a firewall profile to the IPSet that defines its "Minimum Trust" boundary.
pstat_profile_sources:
  access-level1-public: "0.0.0.0/0"
  access-level2-internal: "ipset:campus"
  access-level3-restricted: "ipset:management"

# --- Global Administrative Policies (The VIP Lanes) ---
# Policies are processed BEFORE zones. They ensure admin access regardless of NIC zone.
pstat_firewall_policies:
  - name: mgmt-ssh
    ingress: "ANY"
    egress: "HOST"
    rules:
      - { source: "ipset:management", service: "ssh", action: "accept" }
      - { source: "ipset:management", service: "cockpit", action: "accept" }

# --- Capability Registry ---
# Maps functional capabilities to technical rules.
# The 'source' is now determined dynamically by the host's pstat_firewall_profile.
pstat_capability_map:
  monitoring_target:
    rules:
      - { port: 9100, proto: "tcp", action: "accept" }
      - { service: "snmp", action: "accept" }
  backup_target:
    rules:
      - { port: 9102, proto: "tcp", action: "accept" }
  campus_ssh:
    rules:
      - { service: "ssh", action: "accept" }
  admin_console:
    rules:
      - { source: "ipset:management", port: 9090, proto: "tcp", action: "accept" }
  network_bridge_transit:
    rules:
      - { transit: "internal-to-campus", source: "ipset:management", action: "accept" }
      - { transit: "campus-to-internal", source: "ipset:management", action: "accept" }
      - { transit: "internal-to-mgmt", source: "ipset:management", action: "accept" }
      - { transit: "internal-to-campus", source: "ipset:tailscale", action: "accept" }
      - { transit: "campus-to-internal", source: "ipset:tailscale", action: "accept" }
      - { transit: "internal-to-mgmt", source: "ipset:tailscale", action: "accept" }

# --- Host Configuration ---
# Default capabilities for all nodes (can be overridden in host_vars)
pstat_capabilities: []

# Mapping for NIC -> Zone (The "Labels")
# Default: Most nodes use eth0 as 'public' for default-deny security.
pstat_nic_zones:
  eth0: "public"
  eth1: "public"

# Baseline zone definitions
pstat_zones:
  public: { source: null }
  internal: { source: "ipset:campus" }
  trusted: { source: "ipset:management" }
