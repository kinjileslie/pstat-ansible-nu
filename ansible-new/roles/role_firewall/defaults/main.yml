---
# Firewall Configuration Defaults
# Define IP sets as: { name: 'set_name', type: 'hash:net' or 'hash:ip', ips: [ 'ip1', 'ip2' ] }

pstat_ipsets:
  - name: management
    type: "hash:ip"
    ips: "{{ pstat_mgmt_ips }}"
  - name: campus
    type: "hash:net"
    ips: ["128.111.0.0/16", "169.229.0.0/16", "169.230.0.0/15", "169.232.0.0/15"]
  - name: monitoring
    type: "hash:ip"
    ips: "{{ pstat_monitoring_ips }}"
  - name: backup-network
    type: "hash:ip"
    ips: "{{ pstat_backup_ips }}"

# Access Level Profiles
# We map our levels to built-in firewalld zones for maximum stability and NetworkManager compatibility.
# Mapping:
#   Level 3 (Restricted) -> 'trusted' zone
#   Level 2 (Internal)   -> 'internal' zone
#   Level 1 (Public)     -> 'public' zone
pstat_firewall_profiles:
  access-level1-public:
    public: ["ssh", "snmp"]
    internal: ["ssh", "snmp"]
    trusted: ["ssh", "snmp", "cockpit"]
  access-level2-internal:
    public: []
    internal: ["ssh", "snmp"]
    trusted: ["ssh", "snmp", "cockpit"]
  access-level3-restricted:
    public: []
    internal: []
    trusted: ["ssh", "snmp", "cockpit"]

# Default profile if none is specified in host_vars
pstat_firewall_profile: "access-level2-internal"

# Zone Mapping: Repurposing built-in zones to avoid NetworkManager conflicts.
pstat_zones:
  public:
    source: null # Default zone, no source needed
  internal:
    source: "ipset:campus"
  trusted:
    source: "ipset:management"
  monitoring:
    source: "ipset:monitoring"
  backup-network:
    source: "ipset:backup-network"
