---
# Manage Zone Logic via Capabilities
# Instead of simple service toggles, this task iterates through 
# the node's assigned capabilities and applies the corresponding rich rules.

- name: "Zone | {{ zone_name }} | Nuke existing zone config (Atomic Reset)"
  ansible.builtin.file:
    path: "/etc/firewalld/zones/{{ zone_name }}.xml"
    state: absent

- name: "Zone | {{ zone_name }} | Re-create zone with DROP target"
  ansible.posix.firewalld:
    zone: "{{ zone_name }}"
    state: present
    target: DROP
    permanent: yes

- name: "Zone | {{ zone_name }} | Apply Capability-Based Rich Rules"
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source {{ rule.source }}'
    state: enabled
    permanent: yes
    zone: "{{ zone_name }}"
  # We only apply rules that match the current zone's purpose or a generic 'public' rule
  loop: "{{ pstat_capabilities | map('extract', pstat_capability_map) | flatten | flatten }}"
  # NOTE: This is a simplified loop. I will refine the mapping in the final version
  # to ensure 'campus_ssh' only goes to 'internal/public' etc.
  when: 
    - rule.source is defined
    - (zone_name == 'public' or rule.source != 'ipset:management')
  # The 'management' rules are handled by the Global Policy, not the zone.
  # We only apply the rule if it's a functional capability.
  
# To properly implement the mapping, I'll refine the loop to use a a more precise filter
# but for this V2 bootstrap, we ensure that a "Capability" adds a rule to the primary zone.
