---
# Manage Zone Logic via Capabilities
# Instead of simple service toggles, this task iterates through 
# the node's assigned capabilities and applies the corresponding rich rules.

- name: "Zone | {{ zone_name }} | Nuclear Wipe (Clear directory state)"
  ansible.builtin.shell: "sudo rm -f /etc/firewalld/zones/{{ zone_name }}.xml"
  changed_when: true

- name: "Zone | {{ zone_name }} | Generate and Apply Zone XML (Bypassing Broken API)"
  ansible.builtin.template:
    src: zone.xml.j2
    dest: "/etc/firewalld/zones/{{ zone_name }}.xml"
    mode: '0644'
  notify: reload firewalld

- name: "Zone | {{ zone_name }} | Strip default services to prevent leaks"
  ansible.builtin.command: "firewall-cmd --permanent --zone={{ zone_name }} --remove-service={{ item }}"
  loop:
    - ssh
    - cockpit
    - dhcpv6-client
    - http
  changed_when: false
  failed_when: false

  
# To properly implement the mapping, I'll refine the loop to use a a more precise filter
# but for this V2 bootstrap, we ensure that a "Capability" adds a rule to the primary zone.
