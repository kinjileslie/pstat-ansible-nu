---
# manage_forwarding.yml
# Secure Pivot: Source-aware FORWARD chain via a dedicated nftables table.
#
# firewalld 1.3.4 (AlmaLinux 9) has:
#   - A broken --direct API
#   - Unreliable rich-rule forwarding translation
#   - Set ownership on its 'inet firewalld' table (blocks external nft inserts)
#
# Solution: Our OWN table 'inet pstat_forward' hooks FORWARD at priority -10
# (BEFORE firewalld's +10). Trusted sources are accepted; all else is dropped
# before firewalld ever sees the packet. Established/related connections pass.
#
# This is the "bypass the broken layer" pattern from the project's history.

- name: "Forwarding | Remove legacy interface-based rich rules from public zone"
  ansible.builtin.shell: |
    for rule in $(firewall-cmd --permanent --zone=public --list-rich-rules | grep -E 'forward-port|oifname' || true); do
      firewall-cmd --permanent --zone=public --remove-rich-rule="$rule" 2>/dev/null || true
    done
  changed_when: false
  when: "'network_bridge_transit' in pstat_capabilities"

- name: "Forwarding | Ensure nftables.d directory exists"
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: "'network_bridge_transit' in pstat_capabilities"

- name: "Forwarding | Write nftables forwarding table definition"
  ansible.builtin.copy:
    content: |
      # PSTAT Secure Pivot: Source-aware forwarding
      # Runs BEFORE firewalld (priority -10 vs firewalld's +10)
      # Managed by Ansible - do not edit manually.
      table inet pstat_forward {
          set pstat_mgmt_fwd {
              type ipv4_addr
              flags interval
              elements = { {{ pstat_mgmt_ips | join(', ') }} }
          }
          set pstat_ts_fwd {
              type ipv4_addr
              flags interval
              elements = { 100.120.0.0/24 }
          }
          chain forward {
              type filter hook forward priority -10; policy drop;
              ct state { established, related } accept
              ip saddr @pstat_mgmt_fwd accept
              ip saddr @pstat_ts_fwd accept
          }
      }
    dest: /etc/nftables.d/pstat-forward.nft
    owner: root
    group: root
    mode: '0644'
  when: "'network_bridge_transit' in pstat_capabilities"

- name: "Forwarding | Load forwarding table into kernel"
  ansible.builtin.shell: |
    set -e
    # Flush existing table (idempotent), then load fresh
    nft flush table inet pstat_forward 2>/dev/null || true
    nft -f /etc/nftables.d/pstat-forward.nft
  when: "'network_bridge_transit' in pstat_capabilities"
  changed_when: true

- name: "Forwarding | Verify rules are active"
  ansible.builtin.shell: "nft list table inet pstat_forward"
  register: fwd_verify
  changed_when: false
  failed_when:
    - "'network_bridge_transit' in pstat_capabilities"
    - "'pstat_mgmt_fwd' not in fwd_verify.stdout"
