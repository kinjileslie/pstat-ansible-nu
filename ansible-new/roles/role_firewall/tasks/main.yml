---
- name: Ensure firewalld is running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: yes

- name: "FIREWALL | Sanitize Environment (Pre-Reload)"
  ansible.builtin.shell: "sudo rm -f /etc/firewalld/zones/*.xml /etc/firewalld/ipsets/*.xml"
  changed_when: true

- name: "FIREWALL | Write IPSet XMLs from templates"
  ansible.builtin.template:
    src: ipset.xml.j2
    dest: "/etc/firewalld/ipsets/{{ item.name }}.xml"
  loop: "{{ pstat_ipsets }}"

- name: "FIREWALL | Implement Capability-Based Rich Rules (L2 Symmetry)"
  ansible.builtin.include_tasks: manage_zone.yml
  loop: "{{ pstat_zones.keys() | list }}"
  loop_control:
    loop_var: zone_name

- name: "FIREWALL | First Reload to synchronize XMLs into Kernel"
  ansible.builtin.shell: "firewall-cmd --reload"
  changed_when: true

- name: "FIREWALL | Apply Global Administrative Policies (VIP Lane)"
  ansible.builtin.include_tasks: manage_policy.yml

- name: "FIREWALL | Bind Interfaces to Zones (native, idempotent)"
  ansible.posix.firewalld:
    zone: "{{ item.value }}"
    interface: "{{ item.key }}"
    state: enabled
    permanent: true
  loop: "{{ pstat_nic_zones | dict2items }}"
  changed_when: true

- name: "FIREWALL | Enable kernel forwarding + RP filter (Secure Pivot)"
  ansible.builtin.include_tasks: manage_sysctl.yml
  when: "'network_bridge_transit' in pstat_capabilities"

- name: "FIREWALL | Decommission legacy nft forwarding shim"
  block:
    - name: "FWD | Remove pstat_forward nft table (runtime)"
      ansible.builtin.shell: "nft delete table inet pstat_forward 2>/dev/null || true"
      changed_when: false
    - name: "FWD | Remove pstat_forward nft file (persisted)"
      ansible.builtin.file:
        path: /etc/nftables.d/pstat-forward.nft
        state: absent
  when: "'network_bridge_transit' in pstat_capabilities"

- name: "FIREWALL | Apply Secure Pivot Forwarding (native firewalld policies)"
  ansible.builtin.include_tasks: manage_forward_policy.yml
  # NOTE: manage_forward_policy.yml ends with a verification that reads the
  # live kernel, so a reload must have happened since the policy XMLs were
  # written. The "Second Reload" below (before this include) guarantees that.

- name: "FIREWALL | Second Reload (sync policies + interfaces into kernel)"
  ansible.builtin.shell: "firewall-cmd --reload"
  changed_when: true

- name: "FIREWALL | Verify Secure Pivot dispatch rules (post-reload)"
  ansible.builtin.shell: "nft list chain inet firewalld filter_FORWARD_POLICIES_pre"
  register: pivot_verify
  changed_when: false
  failed_when:
    - "'network_bridge_transit' in pstat_capabilities"
    - "'filter_FWD_policy_ts-to-build' not in pivot_verify.stdout"
    - "'filter_FWD_policy_build-to-ts' not in pivot_verify.stdout"

- name: "FIREWALL | Verify NO legacy Universal Router forward rules (post-reload)"
  # The zone filter_FWD_*_allow chains must not contain source-aware rules
  # (the old "Universal Router" pattern used `ip saddr @...` + `oifname` accepts).
  # A bare `oifname "eth1" accept` is fine — it's the implicit rule firewalld
  # generates when a zone has `forward: yes`.
  ansible.builtin.shell: |
    for chain in filter_FWD_public_allow filter_FWD_internal_allow filter_FWD_trusted_allow; do
      # Grab only rule lines that have BOTH a source/ipset reference AND an interface match
      # (the old Universal Router pattern). A bare `oifname` accept is OK.
      rules=$(nft list chain inet firewalld $chain 2>/dev/null | grep -E 'saddr|ipset|source' || true)
      if [ -n "$rules" ]; then
        echo "UNIVERSAL_ROUTER_DETECTED in $chain:"
        echo "$rules"
        exit 1
      fi
    done
    echo "OK: no legacy source-aware forward rules in zone FWD_*_allow chains"
  register: ur_check
  changed_when: false
  failed_when:
    - "'network_bridge_transit' in pstat_capabilities"
    - "ur_check.rc != 0"

- name: Write Firewall Policy Version Breadcrumb
  ansible.builtin.copy:
    content: |
      Policy Version: {{ ansible_date_time.date }} | Applied by {{ ansible_env.USER }}
      Profile: {{ pstat_firewall_profile | default('unspecified') }}
      Capabilities: {{ pstat_capabilities | join(', ') if pstat_capabilities is defined else 'none' }}
      Architecture: Baseline L2-V2-Symmetry (native firewalld pivot, no nft shim)
    dest: /etc/ansible/firewall_version.txt
    owner: root
    group: root
    mode: '0644'

- name: Audit role success
  ansible.builtin.include_role:
    name: role_audit
  vars:
    audit_role_name: "role_firewall"
