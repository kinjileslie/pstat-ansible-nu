---
- name: Ensure firewalld is running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: yes

- name: "FIREWALL | Nuke existing IPSet XMLs"
  ansible.builtin.shell: "rm -rf /etc/firewalld/ipsets/*.xml"

- name: "FIREWALL | Write IPSet XMLs from templates"
  ansible.builtin.template:
    src: ipset.xml.j2
    dest: "/etc/firewalld/ipsets/{{ item.name }}.xml"
  loop: "{{ pstat_ipsets }}"

- name: "FIREWALL | Populate IPSet entries using ipset binary"
  ansible.builtin.shell: |
    set -e
    cat {{ '/etc/firewalld/ipsets/' + item + '.xml' }} | grep '<entry>' | sed 's/.*<entry>//;s/<\/entry>.*//' | while read ip; do
      ipset add {{ item }} $ip
    done
  loop: "{{ pstat_ipsets | map(attribute='name') | list }}"
  ignore_errors: yes

- name: "FIREWALL | Dynamically Bind Interfaces to Zones (via UUID)"
  shell: |
    set -e
    UUID=$(nmcli -t connection show --active | grep ":{{ item.iface }}$" | cut -d: -f2)
    if [ -z "$UUID" ]; then
      echo "No active connection found for {{ item.iface }}"
      exit 1
    fi
    CONN_ID=$(nmcli -t connection show --active | grep ":{{ item.iface }}$" | cut -d: -f1)
    nmcli connection modify $UUID connection.zone {{ item.zone }}
    nmcli connection modify "$CONN_ID" connection.zone {{ item.zone }}
    nmcli connection up $UUID
  loop:
    - { zone: 'public', iface: 'eth1' }
    - { zone: 'internal', iface: 'eth0' }
  when: item.iface in ansible_interfaces and pstat_firewall_profile != 'access-level3-restricted'
  changed_when: true

- name: "FIREWALL | Bind Management Interface to Trusted Zone (Level 3 Only)"
  shell: |
    set -e
    UUID=$(nmcli -t connection show --active | grep ":{{ item.iface }}$" | cut -d: -f2)
    if [ -z "$UUID" ]; then
      echo "No active connection found for {{ item.iface }}"
      exit 1
    fi
    CONN_ID=$(nmcli -t connection show --active | grep ":{{ item.iface }}$" | cut -d: -f1)
    nmcli connection modify $UUID connection.zone {{ item.zone }}
    nmcli connection modify "$CONN_ID" connection.zone {{ item.zone }}
    nmcli connection up $UUID
  loop:
    - { zone: 'trusted', iface: 'eth0' }
  when: item.iface in ansible_interfaces and pstat_firewall_profile == 'access-level3-restricted'
  changed_when: true

- name: "FIREWALL | Ensure zones exist (Permanent)"
  ansible.posix.firewalld:
    zone: "{{ item }}"
    state: present
    permanent: yes
  loop: "{{ pstat_zones.keys() | list }}"

- name: Configure and Reconcile Zones (Permanent)
  ansible.builtin.include_tasks: manage_zone.yml
  loop: "{{ pstat_zones.keys() | list }}"
  loop_control:
    loop_var: zone_name
  vars:
    zone_services: "{{ pstat_firewall_profiles[pstat_firewall_profile][zone_name] | default([]) }}"

- name: "FIREWALL | Reload firewalld to apply IPSet changes (creates ipsets from XMLs)"
  ansible.builtin.shell: "firewall-cmd --reload"
  changed_when: true

- name: "FIREWALL | Reload firewalld to apply zone changes (preserves zone bindings)"
  ansible.builtin.shell: "firewall-cmd --reload"
  changed_when: true

- name: Write Firewall Policy Version Breadcrumb
  ansible.builtin.copy:
    content: "Policy Version: {{ ansible_date_time.date }} | Applied by {{ ansible_env.USER }} | Baseline L2-Symmetry\n"
    dest: /etc/ansible/firewall_version.txt
    owner: root
    group: root
    mode: '0644'

- name: Audit role success
  ansible.builtin.include_role:
    name: role_audit
  vars:
    audit_role_name: "role_firewall"
