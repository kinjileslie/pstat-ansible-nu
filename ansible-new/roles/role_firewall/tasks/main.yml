---
- name: Ensure /etc/ansible exists
  ansible.builtin.file:
    path: /etc/ansible
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure firewalld is running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: yes

- name: "FIREWALL | Inspect current zones"
  shell: "firewall-cmd --get-zones"
  register: current_zones_raw
  changed_when: false

- name: "FIREWALL | Parse current zones into list"
  set_fact:
    current_zones: "{{ current_zones_raw.stdout.split(' ') }}"

- name: "FIREWALL | Prune legacy/unauthorized zones"
  ansible.posix.firewalld:
    zone: "{{ item }}"
    state: absent
    permanent: yes
  loop: "{{ current_zones | difference(pstat_zones.keys() | list) }}"
  when: 
    - item != 'public'
    - item not in ['block', 'dmz', 'drop', 'external', 'home', 'internal', 'nm-shared', 'trusted', 'work']

- name: Create IP sets from templates
  ansible.builtin.template:
    src: ipset.xml.j2
    dest: "/etc/firewalld/ipsets/{{ item.name }}.xml"
  loop: "{{ pstat_ipsets }}"

- name: Ensure zones exist
  ansible.posix.firewalld:
    zone: "{{ item }}"
    state: present
    permanent: yes
  loop: "{{ pstat_zones.keys() | list }}"

- name: Configure and Reconcile Zones
  ansible.builtin.include_tasks: manage_zone.yml
  loop: "{{ pstat_zones.keys() | list }}"
  loop_control:
    loop_var: zone_name
  vars:
    # Map the current profile's services for the specific zone being processed
    zone_services: "{{ pstat_firewall_profiles[pstat_firewall_profile][zone_name] | default([]) }}"

- name: Write Firewall Policy Version Breadcrumb
  ansible.builtin.copy:
    content: "Policy Version: {{ ansible_date_time.date }} | Applied by {{ ansible_env.USER }} | Baseline L2-MVP\n"
    dest: /etc/ansible/firewall_version.txt
    owner: root
    group: root
    mode: '0644'

- name: Reload firewalld to apply changes
  ansible.builtin.shell: "firewall-cmd --reload"

- name: Audit role success
  ansible.builtin.include_role:
    name: role_audit
  vars:
    audit_role_name: "role_firewall"
