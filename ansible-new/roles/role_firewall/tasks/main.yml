---
- name: Ensure firewalld is running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: yes

- name: "FIREWALL | Nuke existing IPSet XMLs"
  ansible.builtin.shell: "rm -rf /etc/firewalld/ipsets/*.xml"

- name: "FIREWALL | Write IPSet XMLs from templates"
  ansible.builtin.template:
    src: ipset.xml.j2
    dest: "/etc/firewalld/ipsets/{{ item.name }}.xml"
  loop: "{{ pstat_ipsets }}"

- name: "FIREWALL | Dynamically Bind Interfaces to Zones (via UUID)"
  shell: |
    set -e
    # Extract UUID using the primitive terse format that is verified to work on this OS
    UUID=$(nmcli -t connection show --active | grep ":{{ item.iface }}$" | cut -d: -f2)
    if [ -z "$UUID" ]; then
      echo "No active connection found for {{ item.iface }}"
      exit 1
    fi
    # Force the zone on the connection profile
    nmcli connection modify $UUID connection.zone {{ item.zone }}
    # Reapply the connection to push the change to the runtime
    nmcli connection up $UUID
  loop:
    - { zone: 'public', iface: 'eth1' }
    - { zone: 'internal', iface: 'eth0' }
  changed_when: true

- name: "FIREWALL | Ensure zones exist (Permanent)"
  ansible.posix.firewalld:
    zone: "{{ item }}"
    state: present
    permanent: yes
  loop: "{{ pstat_zones.keys() | list }}"

- name: Configure and Reconcile Zones (Permanent)
  ansible.builtin.include_tasks: manage_zone.yml
  loop: "{{ pstat_zones.keys() | list }}"
  loop_control:
    loop_var: zone_name
  vars:
    zone_services: "{{ pstat_firewall_profiles[pstat_firewall_profile][zone_name] | default([]) }}"

- name: "FIREWALL | Hard Restart - Force read from XMLs"
  ansible.builtin.systemd:
    name: firewalld
    state: restarted

- name: "FIREWALL | Final Sync"
  ansible.builtin.shell: "firewall-cmd --reload"

- name: Write Firewall Policy Version Breadcrumb
  ansible.builtin.copy:
    content: "Policy Version: {{ ansible_date_time.date }} | Applied by {{ ansible_env.USER }} | Baseline L2-Symmetry\n"
    dest: /etc/ansible/firewall_version.txt
    owner: root
    group: root
    mode: '0644'

- name: Audit role success
  ansible.builtin.include_role:
    name: role_audit
  vars:
    audit_role_name: "role_firewall"
