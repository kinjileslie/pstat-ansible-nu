---
# manage_sysctl.yml
# Kernel-level networking parameters required for the Secure Pivot.
# firewalld controls packet FILTERING; the kernel must separately be told
# to ROUTE between interfaces (ip_forward) and to enforce strict
# reverse-path filtering (rp_filter) on a dual-homed host.

- name: "SYSCTL | Enable IPv4 forwarding + strict RP filter"
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-pstat-routing.conf
    reload: true
  loop:
    - { key: 'net.ipv4.ip_forward', value: '1' }
    - { key: 'net.ipv4.conf.all.rp_filter', value: '2' }
    - { key: 'net.ipv4.conf.default.rp_filter', value: '2' }
  when: "'network_bridge_transit' in pstat_capabilities"

- name: "SYSCTL | Add persistent campus routes via NetworkManager"
  ansible.builtin.shell: "sudo nmcli connection modify {{ bridge_internal_iface | default('eth1') }} +ipv4.routes '{{ item.network }} {{ item.via }}'"
  loop:
    - { network: "128.111.0.0/16", via: "169.231.224.1" }
    - { network: "169.229.0.0/16", via: "169.231.224.1" }
    - { network: "169.232.0.0/15", via: "169.231.224.1" }
  changed_when: false
  failed_when: false
  when: "'network_bridge_transit' in pstat_capabilities"

- name: "SYSCTL | Re-activate internal interface to apply routes"
  ansible.builtin.shell: "sudo nmcli connection up {{ bridge_internal_iface | default('eth1') }}"
  changed_when: false
  when: "'network_bridge_transit' in pstat_capabilities"

- name: "SYSCTL | Verify campus routes are present"
  ansible.builtin.shell: "ip route get {{ item }} 2>/dev/null | grep -q 'via' && echo 'OK'"
  loop:
    - "128.111.219.36"
    - "169.229.1.1"
    - "169.232.1.1"
  register: route_check
  changed_when: false
  failed_when: false
  when: "'network_bridge_transit' in pstat_capabilities"

- name: "SYSCTL | Warn if campus routes are missing"
  ansible.builtin.debug:
    msg: "WARNING: Campus routes not found for {{ item.item }}: {{ item.stdout }}"
  loop: "{{ route_check.results | default([]) }}"
  when: "item.stdout != 'OK'"

