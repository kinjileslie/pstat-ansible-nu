---
- name: Ensure SSH hardening configuration is applied
  template:
    src: hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart SSHD

- name: Validate SSH configuration syntax
  shell: /usr/sbin/sshd -t
  changed_when: false
  # If this fails, the play stops here, and the handler 'Restart SSHD' 
  # will NOT run, preventing a lockout.
