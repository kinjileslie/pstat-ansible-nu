---
- name: Install yum-utils for reboot check
  ansible.builtin.package:
    name: yum-utils
    state: present

- name: Upgrade all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: yes

- name: Check if reboot is required
  ansible.builtin.command: needs-restarting -r
  register: reboot_required
  ignore_errors: yes
  changed_when: false

- name: Reboot the server if required
  ansible.builtin.reboot:
    msg: "Reboot initiated by Ansible after OS updates"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: uptime
  when: reboot_required.rc != 0

- name: Audit role success
  ansible.builtin.include_role:
    name: role_audit
  vars:
    audit_role_name: "role_os_updates"
