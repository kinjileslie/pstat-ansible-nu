---
# role_lvm_fortress tasks
# Implements the Three-Tier Storage Model on the secondary disk

- name: Ensure lvm2 is installed
  package:
    name: lvm2
    state: present

- name: Create Volume Group (VG) {{ pstat_lvm_vg_name }}
  lvg:
    vg: "{{ pstat_lvm_vg_name }}"
    pvs: "{{ pstat_lvm_disk }}"

- name: Create Logical Volumes (LVs)
  lvol:
    vg: "{{ pstat_lvm_vg_name }}"
    lv: "{{ item.name }}"
    size: "{{ item.size }}"
  loop:
    - { name: 'lv_audit', size: "{{ pstat_lv_audit_size }}" }
    - { name: 'lv_log', size: "{{ pstat_lv_log_size }}" }
    - { name: 'lv_tmp', size: "{{ pstat_lv_tmp_size }}" }
    - { name: 'lv_vartmp', size: "{{ pstat_lv_vartmp_size }}" }
    - { name: 'lv_home', size: "{{ pstat_lv_home_size }}" }
    - { name: 'lv_local', size: "{{ pstat_lv_local_size }}" }

- name: Format LVs with XFS
  filesystem:
    fstype: xfs
    dev: "/dev/{{ pstat_lvm_vg_name }}/{{ item }}"
  loop:
    - lv_audit
    - lv_log
    - lv_tmp
    - lv_vartmp
    - lv_home
    - lv_local

- name: Ensure mount directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ pstat_lv_audit_mount }}"
    - "{{ pstat_lv_log_mount }}"
    - "{{ pstat_lv_tmp_mount }}"
    - "{{ pstat_lv_vartmp_mount }}"
    - "{{ pstat_lv_home_mount }}"
    - "{{ pstat_lv_local_mount }}"

- name: Mount LVs and update fstab
  mount:
    path: "{{ item.mount }}"
    src: "/dev/mapper/{{ pstat_lvm_vg_name }}-{{ item.lv }}"
    fstype: xfs
    opts: "{{ item.opts }}"
    state: mounted
  loop:
    - { lv: 'lv_audit', mount: "{{ pstat_lv_audit_mount }}", opts: "{{ pstat_lv_audit_options }}" }
    - { lv: 'lv_log', mount: "{{ pstat_lv_log_mount }}", opts: "{{ pstat_lv_log_options }}" }
    - { lv: 'lv_tmp', mount: "{{ pstat_lv_tmp_mount }}", opts: "{{ pstat_lv_tmp_options }}" }
    - { lv: 'lv_vartmp', mount: "{{ pstat_lv_vartmp_mount }}", opts: "{{ pstat_lv_vartmp_options }}" }
    - { lv: 'lv_home', mount: "{{ pstat_lv_home_mount }}", opts: "{{ pstat_lv_home_options }}" }
    - { lv: 'lv_local', mount: "{{ pstat_lv_local_mount }}", opts: "{{ pstat_lv_local_options }}" }

- name: Create systemd override directory for auditd
  file:
    path: /etc/systemd/system/auditd.service.d
    state: directory
    mode: '0755'

- name: Add RequiresMountsFor to auditd service
  copy:
    dest: /etc/systemd/system/auditd.service.d/override.conf
    content: |
      [Unit]
      RequiresMountsFor=/var/log/audit
    mode: '0644'

- name: Reload systemd to apply auditd override
  systemd:
    daemon_reload: yes

- name: Audit role success
  ansible.builtin.include_role:
    name: role_audit
  vars:
    audit_role_name: "role_lvm_fortress"
