---
# role_lvm_fortress tasks
# Implements the Three-Tier Storage Model on the secondary disk

- name: Ensure lvm2 is installed
  package:
    name: lvm2
    state: present

- name: Create Volume Group (VG) {{ pstat_lvm_vg_name }}
  lvg:
    vg: "{{ pstat_lvm_vg_name }}"
    pvs: "{{ pstat_lvm_disk }}"

- name: Create Logical Volumes (LVs)
  lvol:
    vg: "{{ pstat_lvm_vg_name }}"
    lv: "{{ item.name }}"
    size: "{{ item.size }}"
  loop:
    - { name: 'lv_audit', size: "{{ pstat_lv_audit_size }}" }
    - { name: 'lv_log', size: "{{ pstat_lv_log_size }}" }
    - { name: 'lv_tmp', size: "{{ pstat_lv_tmp_size }}" }
    - { name: 'lv_vartmp', size: "{{ pstat_lv_vartmp_size }}" }
    - { name: 'lv_home', size: "{{ pstat_lv_home_size }}" }
    - { name: 'lv_local', size: "{{ pstat_lv_local_size }}" }

- name: Format LVs with XFS
  filesystem:
    fstype: xfs
    dev: "/dev/{{ pstat_lvm_vg_name }}/{{ item }}"
  loop:
    - lv_audit
    - lv_log
    - lv_tmp
    - lv_vartmp
    - lv_home
    - lv_local

- name: Ensure mount directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ pstat_lv_audit_mount }}"
    - "{{ pstat_lv_log_mount }}"
    - "{{ pstat_lv_tmp_mount }}"
    - "{{ pstat_lv_vartmp_mount }}"
    - "{{ pstat_lv_home_mount }}"
    - "{{ pstat_lv_local_mount }}"

- name: Mount LVs and update fstab
  block:
    - name: "LVM | Mount non-home LVs"
      mount:
        path: "{{ item.mount }}"
        src: "/dev/mapper/{{ pstat_lvm_vg_name }}-{{ item.lv }}"
        fstype: xfs
        opts: "{{ item.opts }}"
        state: mounted
      loop:
        - { lv: 'lv_log', mount: "{{ pstat_lv_log_mount }}", opts: "{{ pstat_lv_log_options }}" }
        - { lv: 'lv_audit', mount: "{{ pstat_lv_audit_mount }}", opts: "{{ pstat_lv_audit_options }}" }
        - { lv: 'lv_tmp', mount: "{{ pstat_lv_tmp_mount }}", opts: "{{ pstat_lv_tmp_options }}" }
        - { lv: 'lv_vartmp', mount: "{{ pstat_lv_vartmp_mount }}", opts: "{{ pstat_lv_vartmp_options }}" }
        - { lv: 'lv_local', mount: "{{ pstat_lv_local_mount }}", opts: "{{ pstat_lv_local_options }}" }

    - name: "LVM | Handle /home migration"
      block:
        - name: "LVM | Create temporary mount point for home migration"
          file:
            path: /mnt/home_migration
            state: directory
            mode: '0755'

        - name: "LVM | Mount new home LV to temporary location"
          mount:
            path: /mnt/home_migration
            src: "/dev/mapper/{{ pstat_lvm_vg_name }}-lv_home"
            fstype: xfs
            opts: "{{ pstat_lv_home_options }}"
            state: mounted

        - name: "LVM | Migrate existing home data to new LV"
          shell: "rsync -aX /home/ /mnt/home_migration/"
          changed_when: true

        - name: "LVM | Unmount temporary migration point"
          mount:
            path: /mnt/home_migration
            state: unmounted

        - name: "LVM | Mount new home LV to /home"
          mount:
            path: "{{ pstat_lv_home_mount }}"
            src: "/dev/mapper/{{ pstat_lvm_vg_name }}-lv_home"
            fstype: xfs
            opts: "{{ pstat_lv_home_options }}"
            state: mounted

        - name: "LVM | Remove temporary mount point"
          file:
            path: /mnt/home_migration
            state: absent

    - name: "LVM | Sync and Settle Mounts"
      shell: "sync && ls -d {{ pstat_lv_audit_mount }} {{ pstat_lv_home_mount }} {{ pstat_lv_local_mount }} && sleep 2"
      changed_when: false

- name: Ensure critical security mount points have correct SELinux labels
  shell: "restorecon -Rv {{ item }}"
  loop:
    - "{{ pstat_lv_audit_mount }}"
    - "{{ pstat_lv_log_mount }}"
  register: restorecon_result
  until: restorecon_result.rc == 0
  retries: 5
  delay: 1
  changed_when: false

- name: Restore home directory for the deployment user
  file:
    path: /home/almalinux
    state: directory
    owner: almalinux
    group: almalinux
    mode: '0700'

- name: Create systemd override directory for auditd
  file:
    path: /etc/systemd/system/auditd.service.d
    state: directory
    mode: '0755'

- name: Add RequiresMountsFor to auditd service
  copy:
    dest: /etc/systemd/system/auditd.service.d/override.conf
    content: |
      [Unit]
      RequiresMountsFor=/var/log/audit
    mode: '0644'

- name: Reload systemd to apply auditd override
  systemd:
    daemon_reload: yes

- name: Ensure SSH access is restored after LVM mount
  ansible.builtin.include_role:
    name: role_provision_access
  vars:
    audit_role_name: "role_provision_access_post_lvm"

- name: Audit role success
  ansible.builtin.include_role:
    name: role_audit
  vars:
    audit_role_name: "role_lvm_fortress"
