---
# LVM Fortress Defaults
# Defines the layout for the secondary storage disk (vdb)

# The target disk for the LVM Volume Group
pstat_lvm_disk: /dev/vdb
pstat_lvm_vg_name: vg_fortress

# Logical Volume sizes
# Audit: High security, isolated logs
pstat_lv_audit_size: 5G
pstat_lv_audit_mount: /var/log/audit
pstat_lv_audit_options: "defaults,nodev,nosuid,noexec"

# System Logs: Isolated from root
pstat_lv_log_size: 10G
pstat_lv_log_mount: /var/log
pstat_lv_log_options: "defaults,nodev,nosuid"

# Temp: Isolated for security/stability
pstat_lv_tmp_size: 10G
pstat_lv_tmp_mount: /tmp
pstat_lv_tmp_options: "defaults,nodev,nosuid,noexec"

# Local: The "Absorber" for user data and containers
pstat_lv_local_size: 70G
pstat_lv_local_mount: /local
pstat_lv_local_options: "defaults"

# Note: We leave ~20GB unallocated for future expansion.
