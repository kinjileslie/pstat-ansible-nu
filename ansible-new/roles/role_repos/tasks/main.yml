---
- name: Install LSIT Common Repository
  dnf:
    disable_gpg_check: yes
    name: "https://identity.aristotle.ucsb.edu/repo/lsit/el9/common/x86_64/lsit-release-9-1.el9.noarch.rpm"
    state: present

- name: Flush handlers to ensure repo is available
  meta: flush_handlers

- name: Install LSIT Common group
  dnf:
    name: "@lsit-common"
    state: present

- name: Add Bacula Community Repository
  ansible.builtin.yum_repository:
    name: bacula
    description: Bacula Community 15.0.2
    baseurl: "https://www.bacula.org/packages/5fdba49f8988f/rpms/15.0.2/el{{ ansible_distribution_major_version }}/x86_64/"
    gpgkey: "https://bacula.org/downloads/Bacula-4096-Distribution-Verification-key.asc"
    exclude: bacula-mysql
    enabled: true
    gpgcheck: true

- name: Audit role success
  ansible.builtin.include_role:
    name: role_audit
  vars:
    audit_role_name: "role_repos"
