# Host variables for the SeaBastion Admin Jump Host
# Role: Secure entry point for system administration (Admin Bastion).
# This host provides a secure jump point for SSH ProxyJump and TCP tunnelling 
# into isolated networks. It is NOT a Layer 3 network gateway or router.

# 1. Security Posture: Only Management IPs can enter (The most restricted profile)
pstat_firewall_profile: "access-level3-restricted"

# 2. Capabilities: Minimal surface area, focused on admin access
pstat_capabilities:
  - campus_ssh      # Allow SSH from management (via the profile clamp)
  - admin_console   # Allow Cockpit (port 9090) from management
  - network_bridge_transit # Secure Pivot: Forwarding restricted to Management and Tailscale sources

# --- Network Bridge Overrides for dual‑homed seabastion ---
# Public NIC (default gateway) is eth0; internal NIC is eth1.
bridge_internal_iface: eth1
bridge_external_iface: eth0
# Internal gateway (campus side) – same as the route we already persist.
bridge_internal_gw: 169.231.224.1
bridge_internal_routes:
  - { network: "128.111.0.0/16", via: "169.231.224.1" }
  - { network: "169.229.0.0/16", via: "169.231.224.1" }
  - { network: "169.232.0.0/15", via: "169.231.224.1" }

# 3. Identity: Local-only for high availability (Avoid circular dependencies)
is_ldap_enabled: false

# 4. Networking: Dual-homed for connectivity, but no kernel routing
# Connectivity is maintained via dual NICs to Management and Internal networks.
# SSH ProxyJump and Tunnelling are handled at the application layer.

# 5. Secure Pivot: Bind each NIC to its logical zone.
#    eth0 -> public (default-deny), eth1 -> internal (build subnet),
#    tailscale0 -> trusted (tailnet). This is REQUIRED for the native
#    firewalld forwarding policies (ts-to-build / build-to-ts) to match.

# Optional override for the egress zone used by the ts-to-build forwarding policy.
# Set to "public" (default) to masquerade to the public IP, or "internal" to use the
# internal NIC address for NAT. This variable is read by role_firewall defaults.

pstat_ts_to_build_egress: "public"

pstat_nic_zones:
  eth0: "public"
  eth1: "internal"
  tailscale0: "trusted"
