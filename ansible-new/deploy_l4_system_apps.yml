---
# ==============================================================================
# LAYER 4 - SYSTEM APPS & PLUMBING
# ==============================================================================
# This playbook configures core infrastructure capabilities. 
# Roles are applied conditionally based on capabilities defined in host_vars.
# ==============================================================================

- name: Layer 4 - System Apps and Plumbing
  hosts: pstat
  become: yes
  gather_facts: yes

  tasks:
    - name: "CAPABILITY | Network Bridge (Core-and-Spoke Routing)"
      include_role:
        name: role_network_bridge
      when: is_network_bridge | default(false)
      tags: [role_network_bridge, network_bridge]

    - name: "CAPABILITY | LDAP/SSSD Identity Management"
      include_role:
        name: role_sssd_ldap
      when: is_ldap_enabled | default(false)
      tags: [role_sssd_ldap, ldap_sssd, identity_management]

    - name: "CAPABILITY | Other L4 Services"
      debug:
        msg: "Other L4 services (PMM, Splunk, etc.) are currently on hold."

    - name: "L4 | Web Server Base"
      include_role:
        name: role_web_server
      when: "'web_server_base' in pstat_capabilities | default([])"
      tags: [role_web_server, web_server]

    - name: "L4 | Web Server SSL"
      include_role:
        name: role_web_server_ssl
      when: "'web_server_ssl' in pstat_capabilities | default([])"
      tags: [role_web_server_ssl, web_ssl]

    - name: "L4 | Web Server Hardened"
      include_role:
        name: role_web_server_hardened
      when: "'web_server_hardened' in pstat_capabilities | default([])"
      tags: [role_web_server_hardened, web_hardened]

    - name: "L4 | Web Server Monitored"
      include_role:
        name: role_web_server_monitored
      when: "'web_server_monitored' in pstat_capabilities | default([])"
      tags: [role_web_server_monitored, web_monitored]
