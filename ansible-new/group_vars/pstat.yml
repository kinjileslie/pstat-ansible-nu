pstat_key_nu_gold: 'ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLJPjUjzPfOQJFGj6rKJ0tWDPpxwJWLs9O3efR/9NarwFAc41pkD/F/x41T0z+iEy92+HD1d5q542oKxDuDxrcs= KINJI ANSIBLE NU GOLD'
pstat_key_bobby_rsa: 'ssh-rsa  root@bob.aristotle.ucsb.edu'
pstat_key_bobby_ecdsa: 'ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCngyHXN9ZXJanXsya27/r+DoC6qYEZ4wLcL7EVQ5YoatD77zbxXTWsz5D/wMEIWvoQHhl1HZDGRrvr5r+UKiQ4= root@bobby.lsit.ucsb.edu'
pstat_key_bobby_ed25519: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEPPPGTmkqb81IwtNvVFFVXEMOkJxCVhvkf/+BlAVlGw root@bobby.lsit.ucsb.edu'
pstat_key_kinji_red: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHoZmhYCEtQ58uWzUFTFNWVR347SuB0bNi4KckbuBZXX KINJI RED KEY 20260310'

# Master List of Administrative Keys (for legacy roles/audit)
administrative_keys:
  - "{{ pstat_key_nu_pink }}"
  - "{{ pstat_key_nu_gold }}"
  - "{{ pstat_key_bobby_rsa }}"
  - "{{ pstat_key_bobby_ecdsa }}"
  - "{{ pstat_key_bobby_ed25519 }}"
  - "{{ pstat_key_kinji_red }}"

pstat_base_packages:
  - firewalld
  - fail2ban
  - git
  - curl
  - wget
  - vim-enhanced
  - tmux
  - tree
  - lvm2
  - net-tools
  - bind-utils
  - tcpdump
  - nmap
  - nmap-ncat
  - lsof
  - lshw
  - lsscsi
  - yum-utils
  - rsync
  - parted
  - bash-completion

# 3. Management & Jump Host Identities
# These IPs are trusted for SSH and are ignored by Fail2Ban.
pstat_mgmt_ips:
  - 169.231.230.113  # eddie.lsit.ucsb.edu
  - 128.111.90.175   # albedo.lsit.ucsb.edu
  - 169.231.235.191  # bob.aristotle.ucsb.edu
  - 128.111.126.115  # dlr.lsit.ucsb.edu
  - 128.111.90.54    # unifi.lscg.ucsb.edu
  - 128.111.219.20   # sauza.pstat.ucsb.edu
  - 10.2.17.199      # seabastion (Internal)
  - 169.231.229.92   # seabastion (Management)

# 4. Backup Infrastructure
pstat_backup_ips:
  - 128.111.90.156   # backup-network

# 5. Monitoring Infrastructure
pstat_monitoring_ips:
  - 169.231.234.39
  - 169.231.230.29

# 6. Time Infrastructure
pstat_ntp_servers:
  - 128.111.1.5
  - 128.111.1.6

# 7. LVM Fortress Configuration
pstat_lvm_disk: /dev/vdb
pstat_lvm_vg_name: vg_fortress

# Volume Sizes (The Blueprint)
pstat_lv_audit_size: 5G
pstat_lv_log_size: 10G
pstat_lv_tmp_size: 10G
pstat_lv_vartmp_size: 5G
pstat_lv_home_size: 20G
pstat_lv_local_size: 49G

# Mount Paths (The Policy)
pstat_lv_audit_mount: /var/log/audit
pstat_lv_log_mount: /var/log
pstat_lv_tmp_mount: /tmp
pstat_lv_vartmp_mount: /var/tmp
pstat_lv_home_mount: /home
pstat_lv_local_mount: /local

# Mount Options (The Policy)
pstat_lv_audit_options: "defaults,nodev,nosuid,noexec,nofail"
pstat_lv_log_options: "defaults,nodev,nosuid,nofail"
pstat_lv_tmp_options: "defaults,nodev,nosuid,noexec,nofail"
pstat_lv_vartmp_options: "defaults,nodev,nosuid,noexec,nofail"
pstat_lv_home_options: "defaults,nodev,nofail"
pstat_lv_local_options: "defaults,nofail"

# 8. XFS Quota Configuration
pstat_quota_kernel_args: "rootflags=uquota,gquota,pquota"
pstat_quota_mounts:
  - /local
  - /tmp
  - /var/log
  - /var/log/audit

# 9. Crypto Policy Control
# Set to 'false' to allow modern algorithms (Ed25519) for administrative access.
# Set to 'true' only for nodes requiring strict FIPS compliance.
configure_crypto_policy: false
# Alias for FIPS toggle (maintains backward compatibility)
is_fips_enabled: "{{ configure_crypto_policy | default(false) }}"
var_system_crypto_policy: "DEFAULT"

# 10. Identity Registry
# Maps logical identity roles to physical files on the management host.
# Nu-Pink: Modern, fast, deterministic. Use for all standard operations.
# Nu-Gold: FIPS-compliant ECDSA. Use ONLY for nodes with 'is_fips_enabled: true'.
# NOTE: Paths relative to SSH config directory or absolute from management host.
pstat_identity_registry:
  nu_pink: 
    path: "~/.ssh/ansible-nu-pink_ed25519"
    policy: "DEFAULT"
    description: "Standard Administrative Build Key"
  nu_gold: 
    path: "~/.ssh/ansible-nu-gold_ecdsa"
    policy: "FIPS"
    description: "FIPS-Compliant Management Key"

# The Active Build Key (Logical Name)
# Default is Nu-Pink. Switch to Nu-Gold for FIPS-hardened nodes.
pstat_active_build_key: "{{ is_fips_enabled | ternary('nu_gold', 'nu_pink') }}"

# Ansible Engine Binding
# Dynamically selects the path based on the active build key registry entry.
ansible_ssh_private_key_file: "{{ pstat_identity_registry[pstat_active_build_key].path }}"

# 11. Firewall Policy Engine (Symmetry Model)
# Defines the zones used by the L2 Shield.
pstat_zones:
  public: {}
  internal: {}
  trusted: {}

# Maps high-level Access Profiles to their trusted source IPSet.
pstat_profile_sources:
  access-level1-public: "public"
  access-level2-internal: "campus"
  access-level3-restricted: "management"

# Maps Capabilities to specific firewall rules (Port/Protocol/Action).
# These are applied as Rich Rules in the public zone.
pstat_capability_map:
  campus_ssh:
    port: "22"
    proto: "tcp"
    action: "accept"
  admin_console:
    port: "9090"
    proto: "tcp"
    action: "accept"
  monitoring_target:
    port: "10050"
    proto: "tcp"
    action: "accept"
  backup_target:
    port: "9102"
    proto: "tcp"
    action: "accept"
  web_server_base:
    port: "80"
    proto: "tcp"
    action: "accept"
  web_server_ssl:
    port: "443"
    proto: "tcp"
    action: "accept"
  web_server_hardened:
    port: "443"
    proto: "tcp"
    action: "accept"
  web_server_monitored:
    port: "80"
    proto: "tcp"
    action: "accept"
